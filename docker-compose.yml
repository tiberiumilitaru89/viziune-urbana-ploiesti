services:
  postgres:
    image: postgres:16-alpine
    container_name: viziune-urbana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: viziune_urbana
      POSTGRES_USER: viziune
      POSTGRES_PASSWORD: viziune
    ports:
      - "5432:5432"
    volumes:
      - viziune_urbana_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viziune -d viziune_urbana"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  viziune_urbana_postgres: