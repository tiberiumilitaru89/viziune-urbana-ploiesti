name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    name: Gatekeeper (tsc, eslint, tests, next build, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: A
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: A/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Gatekeeper (typecheck, lint, security tests)
        run: npm run gatekeeper

      - name: Production Build (zero-secret build check)
        run: npm run build

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high
